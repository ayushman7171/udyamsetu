<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrepreneurs Directory | ThriveHub</title>
  <meta name="description" content="Discover and connect with verified rural entrepreneurs across India.">
  <link rel="icon" type="image/svg+xml" href="logo/favicon.svg">
  <link rel="alternate icon" href="logo/thrivehub-logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <!-- Logo -->
        <a href="index.html" class="brand" aria-label="ThriveHub">
          <img src="logo/thrivehub-logo.svg" alt="ThriveHub - People · Opportunities · Growth" class="brand-logo" width="140" height="42">
        </a>

        <!-- Desktop Navigation -->
        <nav>
          <ul class="nav-menu">
            <li><a href="dashboard.html" class="nav-link" data-i18n="nav.home">Home</a></li>
            <li><a href="directory.html" class="nav-link active" data-i18n="nav.discover">Discover</a></li>
            <li><a href="discussion.html" class="nav-link" data-i18n="nav.community">Community</a></li>
            <li><a href="collaborations.html" class="nav-link" data-i18n="nav.collaborations">Collaborations</a></li>
            <li><a href="learn.html" class="nav-link" data-i18n="nav.learn">Learn</a></li>
          </ul>
        </nav>

        <!-- Dynamic Header Actions -->
        <div class="header-actions" id="globalHeaderActions">
          <a href="directory.html" class="header-icon-btn" title="Search" data-i18n-title="common.search">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </a>
          <button class="header-icon-btn" title="Notifications" data-i18n-title="nav.notifications" onclick="showToast('You have 2 new partnership requests.')">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <span class="notif-badge"></span>
          </button>
          <a href="profile.html" class="user-avatar-btn" title="My Profile" data-i18n-title="nav.my_profile">
            AS
          </a>
          <button class="mobile-menu-btn" aria-label="Toggle navigation menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Directory Main Layout (Screen 4) -->
  <main class="container">
    <div class="directory-layout">
      <!-- Filter Sidebar -->
      <aside class="filter-sidebar">
        <h2 class="filter-title" data-i18n="directory.filter_by">Filter By</h2>

        <!-- Industry -->
        <div class="form-group">
          <label class="form-label" data-i18n="directory.industry">Industry</label>
          <select id="filterIndustry" class="form-select">
            <option value="All" data-i18n="directory.all_industries">All Industries</option>
            <option value="Handicrafts" data-i18n="categories.Handicrafts">Handicrafts</option>
            <option value="Agriculture" data-i18n="categories.Agriculture">Agriculture</option>
            <option value="Digital Services" data-i18n="categories.Digital Services">Digital Services</option>
            <option value="Food Products" data-i18n="categories.Food Products">Food Products</option>
            <option value="Organic Products" data-i18n="categories.Organic Products">Organic Products</option>
            <option value="Textiles & Handlooms" data-i18n="categories.Textiles & Handlooms">Textiles & Handlooms</option>
          </select>
        </div>

        <!-- Location -->
        <div class="form-group">
          <label class="form-label" data-i18n="directory.location">Location</label>
          <select id="filterLocation" class="form-select">
            <option value="All" data-i18n="directory.all_locations">All Locations / States</option>
            <option value="Uttar Pradesh" data-i18n="states.Uttar Pradesh">Uttar Pradesh</option>
            <option value="Madhya Pradesh" data-i18n="states.Madhya Pradesh">Madhya Pradesh</option>
            <option value="Rajasthan" data-i18n="states.Rajasthan">Rajasthan</option>
            <option value="Maharashtra" data-i18n="states.Maharashtra">Maharashtra</option>
            <option value="Bihar" data-i18n="states.Bihar">Bihar</option>
            <option value="Karnataka" data-i18n="states.Karnataka">Karnataka</option>
          </select>
        </div>

        <!-- Looking For Checkboxes (Screen 4) -->
        <div class="form-group">
          <label class="form-label" data-i18n="directory.looking_for_title">Looking For</label>
          <label class="checkbox-item">
            <input type="checkbox" name="lookingFor" value="Partners" checked>
            <span data-i18n="directory.partners">Partners</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="lookingFor" value="Suppliers">
            <span data-i18n="directory.suppliers">Suppliers</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="lookingFor" value="Distributors">
            <span data-i18n="directory.distributors">Distributors</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="lookingFor" value="Mentors">
            <span data-i18n="directory.mentors">Mentors</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="lookingFor" value="Customers">
            <span data-i18n="directory.customers">Customers</span>
          </label>
        </div>

        <button id="applyFiltersBtn" class="btn btn-primary btn-block btn-sm" style="margin-top: 14px;" data-i18n="directory.apply_filters">
          Apply Filters
        </button>
      </aside>

      <!-- Directory Main Content -->
      <section class="directory-main-area">
        <div class="directory-main-header">
          <h1 style="font-size: 22px; font-weight: 700; color: var(--text-main);" data-i18n="directory.title">Entrepreneurs</h1>
          
          <!-- Search Bar -->
          <div class="directory-search-bar">
            <div class="input-wrapper" style="flex: 1;">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" id="dirSearchInput" class="form-input input-with-icon" placeholder="Search by business name, product, skill, or location..." data-i18n-placeholder="directory.search_placeholder">
            </div>
            <button class="btn btn-primary" onclick="document.getElementById('applyFiltersBtn').click()" data-i18n="common.search">Search</button>
          </div>
        </div>

        <!-- Directory List (Populated via JS with Screen 4 items: Asha Devi, Green Harvest, Rahul Sharma, etc.) -->
        <div id="directoryList" class="directory-list">
          <!-- Fallback Server-side or Static markup rendered immediately -->
        </div>
      </section>
    </div>
  </main>
  <!-- Supabase Client SDK & Configuration (Vercel & Static Ready) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/supabase-api.js"></script>


  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
