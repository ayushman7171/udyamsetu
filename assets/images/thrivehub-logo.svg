<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ThriveHub</title>
  <desc id="desc">ThriveHub brand logo with an abstract connected-growth mark and the tagline People. Opportunities. Growth.</desc>
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19A887"/><stop offset="1" stop-color="#087F70"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#174C7E"/><stop offset="1" stop-color="#0B2343"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="26" fill="#FFFFFF"/>
  <!-- A connected, growing mark: three people/ideas meeting around a rising path -->
  <g transform="translate(46 45)">
    <circle cx="76" cy="67" r="18" fill="#174C7E"/>
    <circle cx="142" cy="36" r="22" fill="#F6A928"/>
    <circle cx="208" cy="67" r="18" fill="#159A7D"/>
    <path d="M38 111 C43 163 75 194 119 207 C131 210 141 219 143 232 C145 204 137 178 117 157 C97 137 69 124 38 111Z" fill="url(#blue)"/>
    <path d="M246 111 C241 163 209 194 165 207 C153 210 143 219 141 232 C139 204 147 178 167 157 C187 137 215 124 246 111Z" fill="url(#green)"/>
    <path d="M142 204 C142 174 142 146 142 118" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
    <path d="M142 147 C164 126 181 106 194 84" fill="none" stroke="#159A7D" stroke-width="13" stroke-linecap="round"/>
    <path d="M176 88 L197 80 L197 102" fill="none" stroke="#159A7D" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="Inter, Manrope, Arial, sans-serif">
    <text x="340" y="190" font-size="104" font-weight="800" letter-spacing="-5" fill="#102D50">Thrive<tspan fill="#108A78">Hub</tspan></text>
    <rect x="347" y="218" width="58" height="5" rx="2.5" fill="#F6A928"/>
    <text x="422" y="230" font-size="20" font-weight="650" letter-spacing="4.1" fill="#526174">PEOPLE  ·  OPPORTUNITIES  ·  GROWTH</text>
  </g>
</svg>
